<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Writeups</title>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    :root {
      --bg: #050505;
      --surface: #101010;
      --surface-hover: #1a1a1a;
      --text: #f5f5f5;
      --muted: #a0a0a0;
      --border: #fff;
      --border-width: 3px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    button {
      font: inherit;
    }

    .container {
      width: min(1100px, calc(100% - 40px));
      margin: 0 auto;
    }

    /* Header */

    .header {
      padding: 28px 0;
      border-bottom: var(--border-width) solid var(--border);
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      color: var(--text);
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -1px;
      text-decoration: none;
    }

    .header-label {
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* Hero */

    .hero {
      margin: 36px 0;
      padding: 60px 48px;
      background: var(--surface);
      border: var(--border-width) solid var(--border);
      border-radius: 0;
    }

    .hero h1 {
      margin: 0 0 20px;
      font-size: clamp(38px, 7vw, 76px);
      line-height: 1;
      letter-spacing: -4px;
      font-weight: 900;
    }

    .hero p {
      max-width: 650px;
      margin: 0;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.7;
    }

    /* Sections */

    .section {
      margin: 52px 0;
    }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
    }

    .section-heading h2 {
      margin: 0;
      font-size: 27px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    /* Cards */

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }

    .card {
      display: flex;
      flex-direction: column;
      gap: 18px;
      min-height: 160px;
      padding: 24px;
      color: var(--text);
      text-align: left;
      background: var(--surface);
      border: var(--border-width) solid var(--border);
      border-radius: 0;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.15s ease;
    }

    .card:hover {
      background: var(--surface-hover);
      transform: translateY(-3px);
    }

    .card:focus-visible,
    button:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 5px;
    }

    .card-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      border: var(--border-width) solid var(--border);
      color: #fff;
      font-size: 21px;
      font-weight: 800;
    }

    .card-title {
      font-size: 18px;
      font-weight: 750;
      overflow-wrap: anywhere;
    }

    .card-description {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    /* Navigation and buttons */

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      margin: 36px 0 24px;
    }

    .breadcrumbs {
      color: var(--muted);
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .back-button,
    .action-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 10px 18px;
      color: #fff;
      background: var(--surface);
      border: var(--border-width) solid var(--border);
      border-radius: 0;
      font-weight: 750;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .back-button:hover,
    .action-button:hover {
      background: var(--surface-hover);
    }

    /* File list */

    .file-list {
      display: grid;
      gap: 14px;
    }

    .file-card {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
      padding: 18px 20px;
      color: var(--text);
      background: var(--surface);
      border: var(--border-width) solid var(--border);
      border-radius: 0;
      text-align: left;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .file-card:hover {
      background: var(--surface-hover);
    }

    .file-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 42px;
      width: 42px;
      height: 42px;
      border: var(--border-width) solid var(--border);
      font-size: 20px;
      font-weight: 800;
    }

    .file-info {
      min-width: 0;
    }

    .file-name {
      display: block;
      font-size: 15px;
      font-weight: 750;
      overflow-wrap: anywhere;
    }

    .file-type {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
    }

    /* Markdown content */

    .content {
      margin: 28px 0 60px;
      padding: 36px;
      background: var(--surface);
      border: var(--border-width) solid var(--border);
      border-radius: 0;
      line-height: 1.75;
      overflow-wrap: anywhere;
    }

    .content h1,
    .content h2,
    .content h3,
    .content h4 {
      color: #fff;
      line-height: 1.3;
    }

    .content h1 {
      padding-bottom: 14px;
      border-bottom: 2px solid #fff;
    }

    .content h2 {
      margin-top: 36px;
      padding-bottom: 8px;
      border-bottom: 2px solid #fff;
    }

    .content a {
      color: #fff;
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .content img {
      max-width: 100%;
      height: auto;
      border: 2px solid #fff;
    }

    .content pre {
      padding: 20px;
      background: #050505;
      border: 2px solid #fff;
      overflow-x: auto;
    }

    .content code {
      font-family: "SFMono-Regular", Consolas, monospace;
    }

    .content :not(pre) > code {
      padding: 2px 6px;
      background: #222;
      border: 1px solid #fff;
    }

    .content blockquote {
      margin-left: 0;
      padding: 4px 20px;
      border-left: 4px solid #fff;
      color: var(--muted);
    }

    .content table {
      width: 100%;
      border-collapse: collapse;
      display: block;
      overflow-x: auto;
    }

    .content th,
    .content td {
      padding: 10px 14px;
      border: 2px solid #fff;
      text-align: left;
    }

    .content th {
      background: #222;
    }

    .content hr {
      border: 0;
      border-top: 2px solid #fff;
      margin: 30px 0;
    }

    /* Status messages */

    .message {
      padding: 24px;
      background: var(--surface);
      border: var(--border-width) solid var(--border);
      color: var(--muted);
      line-height: 1.6;
    }

    .error {
      color: #fff;
    }

    .hidden {
      display: none !important;
    }

    /* Footer */

    .footer {
      margin-top: 70px;
      padding: 28px 0;
      border-top: var(--border-width) solid var(--border);
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .container {
        width: min(100% - 28px, 1100px);
      }

      .hero {
        padding: 38px 24px;
      }

      .hero h1 {
        letter-spacing: -2px;
      }

      .content {
        padding: 22px;
      }

      .header-label {
        font-size: 11px;
      }

      .section-heading h2 {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>
  <header class="header">
    <div class="container header-inner">
      <a class="logo" href="#" id="home-link">WRITEUPS</a>
      <span class="header-label">Knowledge base</span>
    </div>
  </header>

  <main class="container">
    <section class="hero" id="hero">
      <h1>Writeups.</h1>
      <p>
        A collection of writeups, notes, and research.
        Explore the topics and open the materials.
      </p>
    </section>

    <section class="section" id="categories-section">
      <div class="section-heading">
        <h2>Categories</h2>
      </div>
      <div class="grid" id="categories"></div>
    </section>

    <section class="section hidden" id="browser-section">
      <div class="toolbar">
        <button class="back-button" id="back-button" type="button">
          Back
        </button>
        <div class="breadcrumbs" id="breadcrumbs"></div>
      </div>

      <div class="section-heading">
        <h2 id="page-title"></h2>
      </div>

      <div id="items" class="file-list"></div>
      <div id="page-message" class="message hidden"></div>
    </section>

    <section class="section hidden" id="reader-section">
      <div class="toolbar">
        <button class="back-button" id="reader-back-button" type="button">
          Back
        </button>
        <div class="breadcrumbs" id="reader-breadcrumbs"></div>
      </div>

      <article class="content" id="markdown-content"></article>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      Writeups
    </div>
  </footer>

  <script>
    const OWNER = "tr4itor";
    const REPOSITORY = "Writeups";
    const BRANCH = "main";
    const ROOT_DIRECTORY = "general";

    const API_BASE =
      `https://api.github.com/repos/${OWNER}/${REPOSITORY}/contents`;

    const RAW_BASE =
      `https://raw.githubusercontent.com/${OWNER}/${REPOSITORY}/${BRANCH}`;

    const categoriesElement = document.getElementById("categories");
    const browserSection = document.getElementById("browser-section");
    const readerSection = document.getElementById("reader-section");
    const categoriesSection = document.getElementById("categories-section");
    const hero = document.getElementById("hero");

    const itemsElement = document.getElementById("items");
    const pageTitle = document.getElementById("page-title");
    const breadcrumbs = document.getElementById("breadcrumbs");
    const readerBreadcrumbs = document.getElementById("reader-breadcrumbs");
    const markdownContent = document.getElementById("markdown-content");
    const pageMessage = document.getElementById("page-message");

    const backButton = document.getElementById("back-button");
    const readerBackButton = document.getElementById("reader-back-button");

    let navigation = [];
    let currentPage = null;

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[char]);
    }

    function getName(path) {
      return path.split("/").filter(Boolean).pop() || path;
    }

    function showMessage(message, isError = false) {
      pageMessage.textContent = message;
      pageMessage.classList.remove("hidden");
      pageMessage.classList.toggle("error", isError);
    }

    function hideMessage() {
      pageMessage.classList.add("hidden");
      pageMessage.classList.remove("error");
    }

    function showHome() {
      currentPage = null;
      navigation = [];

      hero.classList.remove("hidden");
      categoriesSection.classList.remove("hidden");
      browserSection.classList.add("hidden");
      readerSection.classList.add("hidden");
    }

    function setInnerPage() {
      hero.classList.add("hidden");
      categoriesSection.classList.add("hidden");
      browserSection.classList.remove("hidden");
      readerSection.classList.add("hidden");
    }

    function setReaderPage() {
      hero.classList.add("hidden");
      categoriesSection.classList.add("hidden");
      browserSection.classList.add("hidden");
      readerSection.classList.remove("hidden");
    }

    function updateBreadcrumb(path) {
      breadcrumbs.textContent = path
        .replace(`${ROOT_DIRECTORY}/`, "")
        .replaceAll("/", " / ");
    }

    function updateReaderBreadcrumb(path) {
      readerBreadcrumbs.textContent = path
        .replace(`${ROOT_DIRECTORY}/`, "")
        .replaceAll("/", " / ");
    }

    async function fetchDirectory(path) {
      const response = await fetch(
        `${API_BASE}/${path.split("/").map(encodeURIComponent).join("/")}?ref=${BRANCH}`
      );

      if (!response.ok) {
        throw new Error(`GitHub API error: ${response.status}`);
      }

      return response.json();
    }

    function createCard(item) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "card";

      const icon = document.createElement("span");
      icon.className = "card-icon";
      icon.textContent = item.type === "dir" ? "＋" : "$";

      const title = document.createElement("span");
      title.className = "card-title";
      title.textContent = item.name;

      const description = document.createElement("span");
      description.className = "card-description";
      description.textContent =
        item.type === "dir" ? "Open category" : "Open file";

      button.append(icon, title, description);

      button.addEventListener("click", () => {
        if (item.type === "dir") {
          openFolder(item.path);
        } else {
          openFile(item.path);
        }
      });

      return button;
    }

    async function loadCategories() {
      categoriesElement.innerHTML = `
        <div class="message">Loading categories...</div>
      `;

      try {
        const contents = await fetchDirectory(ROOT_DIRECTORY);
        const folders = contents.filter(item => item.type === "dir");

        categoriesElement.innerHTML = "";

        if (!folders.length) {
          categoriesElement.innerHTML =
            '<div class="message">No categories found.</div>';
          return;
        }

        folders.forEach(folder => {
          categoriesElement.appendChild(createCard(folder));
        });
      } catch (error) {
        categoriesElement.innerHTML = "";
        const message = document.createElement("div");
        message.className = "message error";
        message.textContent =
          "Could not load categories. Check the repository and branch settings.";
        categoriesElement.appendChild(message);
        console.error(error);
      }
    }

    async function openFolder(path, addHistory = true) {
      if (addHistory && currentPage) {
        navigation.push(currentPage);
      } else if (addHistory && !currentPage) {
        navigation.push({ type: "home" });
      }

      currentPage = { type: "folder", path };
      setInnerPage();
      hideMessage();

      pageTitle.textContent = getName(path);
      updateBreadcrumb(path);
      itemsElement.innerHTML = '<div class="message">Loading...</div>';

      try {
        const contents = await fetchDirectory(path);
        itemsElement.innerHTML = "";

        const sorted = contents.slice().sort((a, b) => {
          if (a.type !== b.type) {
            return a.type === "dir" ? -1 : 1;
          }
          return a.name.localeCompare(b.name);
        });

        if (!sorted.length) {
          showMessage("This folder is empty.");
          return;
        }

        sorted.forEach(item => {
          const row = document.createElement("button");
          row.type = "button";
          row.className = "file-card";

          const icon = document.createElement("span");
          icon.className = "file-icon";
          icon.textContent = item.type === "dir" ? "＋" : "$";

          const info = document.createElement("span");
          info.className = "file-info";

          const name = document.createElement("span");
          name.className = "file-name";
          name.textContent = item.name;

          const type = document.createElement("span");
          type.className = "file-type";
          type.textContent = item.type === "dir" ? "Folder" : "File";

          info.append(name, type);
          row.append(icon, info);

          row.addEventListener("click", () => {
            if (item.type === "dir") {
              openFolder(item.path);
            } else {
              openFile(item.path);
            }
          });

          itemsElement.appendChild(row);
        });
      } catch (error) {
        itemsElement.innerHTML = "";
        showMessage(
          "Could not load this folder. Make sure it exists and is publicly accessible.",
          true
        );
        console.error(error);
      }
    }

    async function openFile(path, addHistory = true) {
      if (addHistory && currentPage) {
        navigation.push(currentPage);
      }

      currentPage = { type: "file", path };
      setReaderPage();
      updateReaderBreadcrumb(path);
      markdownContent.innerHTML = "<p>Loading...</p>";

      try {
        const response = await fetch(
          `${RAW_BASE}/${path.split("/").map(encodeURIComponent).join("/")}`
        );

        if (!response.ok) {
          throw new Error(`File request failed: ${response.status}`);
        }

        const markdown = await response.text();

        markdownContent.innerHTML = marked.parse(markdown);

        markdownContent.querySelectorAll("a").forEach(link => {
          link.target = "_blank";
          link.rel = "noopener noreferrer";
        });
      } catch (error) {
        markdownContent.textContent =
          "Could not load this file. Please check that it exists.";
        console.error(error);
      }
    }

    function goBack() {
      if (!navigation.length) {
        showHome();
        return;
      }

      const previous = navigation.pop();

      if (previous.type === "home") {
        showHome();
      } else if (previous.type === "folder") {
        openFolder(previous.path, false);
      } else if (previous.type === "file") {
        openFile(previous.path, false);
      } else {
        showHome();
      }
    }

    backButton.addEventListener("click", goBack);
    readerBackButton.addEventListener("click", goBack);

    document.getElementById("home-link").addEventListener("click", event => {
      event.preventDefault();
      showHome();
    });

    loadCategories();
  </script>
</body>
</html>
